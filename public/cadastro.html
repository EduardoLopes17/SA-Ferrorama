<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Ferrovia União</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/style/style.css">
</head>
<body>

    <div class="container-principal">
        <div class="lado-esquerdo">
            <div class="logo-circulo">
                <img src="../assets/img/icone trem.png" alt="Logo">
            </div>
        </div>

        <div class="lado-direito">
            <div class="login-box">
                <h1>CADASTRO</h1>
                
                <form>
                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Nome Completo</label>
                        <input type="text" class="form-control custom-input" placeholder="seu nome">
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">E-mail</label>
                        <input type="email" class="form-control custom-input" placeholder="seu@email.com">
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">CPF</label>
                        <input type="CPF" class="form-control custom-input" placeholder="ex:123456789-00">
                    </div>

                     <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Endereço</label>
                        <input type="endereço" class="form-control custom-input" placeholder="ex: Rua hercílio costa                    nº 245">
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Telefone</label>
                        <input type="telefone" class="form-control custom-input" placeholder="(99) 99999-9999">
                    </div>
                    
                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Nova Senha</label>
                        <input type="password" class="form-control custom-input" placeholder="********">
                    </div>

                    <div class="mb-4 text-start">
                        <label class="form-label fw-bold">Confirmar Senha</label>
                        <input type="password" class="form-control custom-input" placeholder="********">
                    </div>
                    
                    <button type="submit" class="btn-entrar">Cadastrar</button>
                    
                    <div class="mt-3 text-center">
                        <a href="login.html" class="signup-link">Já tem conta? Voltar ao Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
